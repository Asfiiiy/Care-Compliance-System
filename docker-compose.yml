services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: care-backend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./apps/backend:/app
    env_file:
      - ./apps/backend/.env
    depends_on:
      - postgres
      - redis

  postgres:
    build:
      context: .
      dockerfile: infrastructure/docker/postgres.Dockerfile
    container_name: care-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: care_compliance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    build:
      context: .
      dockerfile: infrastructure/docker/redis.Dockerfile
    container_name: care-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: